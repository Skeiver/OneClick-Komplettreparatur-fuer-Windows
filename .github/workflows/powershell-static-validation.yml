name: PowerShell static validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-windows-powershell-51:
    name: Parse with Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse all PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath $PWD -Filter '*.ps1' -File -Recurse)
          if ($files.Count -eq 0) {
              throw 'No PowerShell scripts were found.'
          }

          $hasErrors = $false
          foreach ($file in $files) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null

              foreach ($parseError in @($parseErrors)) {
                  $hasErrors = $true
                  Write-Host ("{0}:{1}:{2}: {3}" -f $file.FullName, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message)
              }
          }

          if ($hasErrors) {
              throw 'PowerShell syntax validation failed.'
          }

          Write-Host ("Successfully parsed {0} PowerShell script(s) with Windows PowerShell {1}." -f $files.Count, $PSVersionTable.PSVersion)

  parse-powershell-7:
    name: Parse with PowerShell 7
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath $PWD -Filter '*.ps1' -File -Recurse)
          if ($files.Count -eq 0) {
              throw 'No PowerShell scripts were found.'
          }

          $hasErrors = $false
          foreach ($file in $files) {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null

              foreach ($parseError in @($parseErrors)) {
                  $hasErrors = $true
                  Write-Host ("{0}:{1}:{2}: {3}" -f $file.FullName, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message)
              }
          }

          if ($hasErrors) {
              throw 'PowerShell syntax validation failed.'
          }

          Write-Host ("Successfully parsed {0} PowerShell script(s) with PowerShell {1}." -f $files.Count, $PSVersionTable.PSVersion)

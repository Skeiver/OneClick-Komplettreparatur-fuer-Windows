name: PowerShell CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate PowerShell script
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'v1.0.0.ps1'
          if (-not (Test-Path -LiteralPath $path)) {
            throw "Expected script not found: $path"
          }

          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          )

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error ("{0}:{1}:{2}: {3}" -f $_.Extent.File, $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message)
            }
            throw "PowerShell parser found $($errors.Count) error(s)."
          }

          Write-Host 'PowerShell syntax validation passed.'

      - name: Validate README file references
        shell: pwsh
        run: |
          $readme = Get-Content -LiteralPath 'README.md' -Raw
          $references = [regex]::Matches($readme, '`([^`]+\.(?:ps1|txt))`') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique

          $missing = foreach ($reference in $references) {
            if (-not (Test-Path -LiteralPath $reference)) {
              $reference
            }
          }

          if ($missing) {
            Write-Host 'README references files that are not present in the repository:'
            $missing | ForEach-Object { Write-Host " - $_" }
            throw 'README file reference validation failed.'
          }

          Write-Host 'README file reference validation passed.'
